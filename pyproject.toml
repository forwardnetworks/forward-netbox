[tool.poetry]
name = "forward-netbox"
version = "3.0.0"
description = "NetBox plugin to sync Forward data into NetBox via built-in NQE queries"
authors = ["Craig Johnson <craigjohnson@forwardnetworks.com>"]
license = "MIT"
readme = "README.md"
keywords = ["netbox", "forward", "plugin", "sync", "nqe"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Topic :: System :: Networking",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
packages = [{include = "forward_netbox"}]

[tool.poetry.urls]
Homepage = "https://github.com/forwardnetworks/forward-netbox"
Repository = "https://github.com/forwardnetworks/forward-netbox"
Documentation = "https://github.com/forwardnetworks/forward-netbox/tree/main/docs"
Changelog = "https://github.com/forwardnetworks/forward-netbox/blob/main/CHANGELOG.md"
"Issue Tracker" = "https://github.com/forwardnetworks/forward-netbox/issues"

[tool.poetry.dependencies]
httpx = ">0.26,<0.29"
# 1.2.0 final declares requires-python >=3.12, which the beta did not.
# Scoped the same way as the optional plugins rather than raising the
# project floor: NetBox 4.7 needs 3.12+ anyway, so this states a fact
# about the dependency rather than working around one.
netboxlabs-netbox-branching = {version = ">=1.2.0,<1.3.0", python = ">=3.12,<3.15"}
pyzipper = ">=0.4.0,<0.5.0"
python = ">=3.10,<3.15"
# Optional NetBox-plugin integrations. The core install pulls none of these;
# their sync maps stay dormant until the plugin is installed AND enabled. Pull
# them with an extra, e.g. `pip install forward-netbox[integrations]` (all) or a
# single one like `forward-netbox[dlm]`. You must still add each plugin to
# PLUGINS in configuration.py and run migrations — see the release notes.
# The `python` marker joins its siblings at 0.9.1: that release raised
# `requires-python` to >=3.12. Without the marker poetry has to satisfy this
# dependency all the way down to our own 3.10 floor and therefore resolves to
# 0.8.0, pinning us a release behind with no error to read.
netbox-dlm = {version = ">=0.4.1,<0.11.0", optional = true, python = ">=3.12,<3.15"}
netbox-routing = {version = "0.4.3", optional = true, python = ">=3.12,<3.15"}
netbox-cisco-aci = {version = "0.4.0", optional = true, python = ">=3.12,<3.15"}
netbox-peering-manager = {version = "0.3.0", optional = true, python = ">=3.12,<3.15"}
netbox-validity = {version = "3.5.2", optional = true, python = ">=3.12,<3.15"}

[tool.poetry.extras]
dlm = ["netbox-dlm"]
routing = ["netbox-routing"]
aci = ["netbox-cisco-aci"]
peering = ["netbox-peering-manager"]
validity = ["netbox-validity"]
integrations = [
    "netbox-dlm",
    "netbox-routing",
    "netbox-cisco-aci",
    "netbox-peering-manager",
    "netbox-validity",
]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
build = "^1.2.2"
invoke = ">=2.2,<4.0"
mkdocs = "^1.6.1"
mkdocs-awesome-pages-plugin = "^2.10.1"
mkdocs-material = "^9.6.12"
pymdown-extensions = ">=10.15,<12.0"
mdx-truly-sane-lists = "^1.3"
pre-commit = "^4.0.1"
pyyaml = "^6.0.3"
python-dotenv = "^1.0.1"
toml = "^0.10.2"

[build-system]
requires = ["poetry-core==2.4.1"]
build-backend = "poetry.core.masonry.api"
