default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: sensitive-content-files
        name: block sensitive customer identifiers in tracked content
        entry: python scripts/check_sensitive_content.py
        language: system
        types: [text]
      - id: sensitive-content-commit-msg
        name: block sensitive customer identifiers in commit messages
        entry: python scripts/check_sensitive_content.py --commit-msg-file
        language: system
        stages: [commit-msg]
        pass_filenames: true
        always_run: true
      - id: conventional-commit
        name: enforce conventional commit subject
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
        pass_filenames: true
        always_run: true
      - id: changelog-up-to-date
        name: CHANGELOG.md matches the README release table
        entry: python scripts/gen_changelog.py --check
        language: system
        files: ^(README\.md|CHANGELOG\.md)$
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/asottile/reorder-python-imports
    rev: v3.16.0
    hooks:
      - id: reorder-python-imports
        # These modules keep a module docstring ahead of their imports, which
        # reorder-python-imports strips the blank line from and black restores,
        # so the two hooks never converge. Formatting stays owned by black.
        # Written on one line: yamlfmt folds a block scalar and injects spaces
        # into the alternation, which silently breaks the pattern.
        # yamllint disable-line rule:line-length
        exclude: "^(forward_netbox/utilities/(merge|diagnostics|fast_baseline|fast_baseline_models|tier3_reducers|contributor_baseline)|forward_netbox/tests/(test_empty_workload_failure|test_query_spec_head_resolution)|scripts/check_release_preflight|scripts/tests/test_release_preflight)\\.py$"
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
  - repo: https://github.com/google/yamlfmt
    rev: v0.20.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
